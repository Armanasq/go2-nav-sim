name: test, build and publish the site
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write        # the last step pushes the built site to gh-pages
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Install Python tools
        run: pip install numpy scipy pytest markdown pyyaml playwright
      - name: Lint (undefined names and other errors that tests can miss)
        run: |
          pip install pyflakes
          python -m pyflakes src/go2_nav_sim/scripts src/go2_nav_sim/test modules site/build.py tools | tee lint.txt
          ! grep -E "undefined name|syntax error|invalid syntax" lint.txt
      - name: Unit tests (registration, gyro integration, world/map consistency)
        run: python -m pytest -v src/go2_nav_sim/test
      - name: First-principles modules (MuJoCo + Pinocchio against the Go2 MJCF)
        run: |
          # the modules render offscreen with MUJOCO_GL=glfw, as on a desktop: give them a virtual display with software OpenGL
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri
          pip install mujoco pin matplotlib
          modules/fetch_go2.sh
          scripts/setup.sh --fetch-only        # m02 compares against the upstream Go2 URDF in src/third_party
          xvfb-run -a -s "-screen 0 1280x1024x24" python -m pytest -v modules
      - name: Build site
        run: python site/build.py
      - name: Check links, page loads and console errors
        run: |
          python -m playwright install --with-deps chromium
          python tools/check_site.py _site
      # Pages serves the gh-pages branch (same as scripts/publish_site.sh): publish only after every check above passed
      - name: Publish to gh-pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd _site && git init -q -b gh-pages && git add -A
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
            commit -q -m "Site build from main@${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
