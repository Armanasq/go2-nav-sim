# 3D lidar -> 2D scan for Nav2 / slam_toolbox. Heights are in base_footprint, which here sits 0.209 m BELOW the real ground
# (CHAMP publishes base_footprint->base_link as a constant 0.426 m; the real base height is ~0.217 m) and is not tilt-compensated.
# The band below is therefore ~0.09-0.69 m above the real ground. A 0.09 m margin over the floor is used up by an uncompensated
# tilt of 0.52 deg at 10 m or 1.6 deg at 3.2 m.
pointcloud_to_laserscan:
  ros__parameters:
    use_sim_time: true
    target_frame: base_footprint
    transform_tolerance: 0.1
    min_height: 0.30
    max_height: 0.90
    angle_min: -3.14159
    angle_max: 3.14159
    angle_increment: 0.00698
    scan_time: 0.1
    range_min: 0.4
    range_max: 15.0
    use_inf: true
    inf_epsilon: 1.0
