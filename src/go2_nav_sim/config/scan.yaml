# 3D lidar -> 2D scan for Nav2 / slam_toolbox. Height band is measured in base_footprint (gravity-aligned through TF),
# so ground (z~0) is excluded even while the trunk pitches during the gait. 0.30 m tolerates ~1.6 deg of tilt error at 10 m; all arena obstacles are >= 0.45 m tall.
pointcloud_to_laserscan:
  ros__parameters:
    use_sim_time: true
    target_frame: base_footprint
    transform_tolerance: 0.1
    min_height: 0.30
    max_height: 0.90
    angle_min: -3.14159
    angle_max: 3.14159
    angle_increment: 0.00698
    scan_time: 0.1
    range_min: 0.4
    range_max: 15.0
    use_inf: true
    inf_epsilon: 1.0
