# odom -> base_footprint: fuses planar lidar odometry (pose + twist) with the IMU yaw rate; owns the odom TF at 50 Hz.
odom_ekf:
  ros__parameters:
    use_sim_time: true
    frequency: 50.0
    two_d_mode: true
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom
    #                x      y      z      roll   pitch  yaw    vx     vy     vz     vroll  vpitch vyaw   ax     ay     az
    odom0: lidar_odom
    odom0_config: [true,  true,  false, false, false, true,  true,  true,  false, false, false, true,  false, false, false]
    odom0_differential: false
    odom0_queue_size: 10
    imu0: imu/data
    imu0_config:  [false, false, false, false, false, false, false, false, false, false, false, true,  false, false, false]
    imu0_differential: false
    imu0_queue_size: 30
    imu0_remove_gravitational_acceleration: false
