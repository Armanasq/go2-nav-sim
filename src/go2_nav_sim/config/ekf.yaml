# odom -> base_footprint at 50 Hz. Each quantity enters once: x, y from the lidar odometry pose (with its registration covariance),
# yaw from the IMU yaw rate. The lidar odometry's yaw and twist are not fused: its yaw is the integrated gyro and its twist is
# differenced from the same poses, so fusing them again would count the same information twice.
odom_ekf:
  ros__parameters:
    use_sim_time: true
    frequency: 50.0
    two_d_mode: true
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom
    #                x      y      z      roll   pitch  yaw    vx     vy     vz     vroll  vpitch vyaw   ax     ay     az
    odom0: lidar_odom
    odom0_config: [true,  true,  false, false, false, false, false, false, false, false, false, false, false, false, false]
    odom0_differential: false
    odom0_queue_size: 10
    imu0: imu/data
    imu0_config:  [false, false, false, false, false, false, false, false, false, false, false, true,  false, false, false]
    imu0_differential: false
    imu0_queue_size: 30
    imu0_remove_gravitational_acceleration: false
